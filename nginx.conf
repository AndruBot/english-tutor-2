server {
    listen 443 ssl;
    access_log  /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    server_name veronikafranz.ru veronikafranz.com;

    ssl_certificate /etc/letsencrypt/live/veronikafranz.ru-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veronikafranz.ru-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /root/projects/english-tutor;
    index index.html;

    # Serve static assets with caching
    location /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Serve images with caching
    location /images/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Serve favicon and other root static files (must come before location /)
    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Handle index.html explicitly to avoid loops
    location = /index.html {
        access_log off;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
